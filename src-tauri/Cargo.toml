[package]
name = "app"
version = "0.1.0"
description = "MarkVault"
authors = ["MarkVault"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
dirs = "5"

# 纯净 PDF 导出：直接调 WebView2 PrintToPdfStream（ICoreWebView2_16）
# 纯净 PDF 导出：直接调 WebView2 PrintToPdfStream（ICoreWebView2_16）
# 剪贴板：CF_HDROP / CF_UNICODETEXT 写入需要 DataExchange + Memory + UI_Shell
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
