<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MarkVault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-top">
        <button id="btn-new">新建</button>
        <input id="search" type="search" placeholder="搜索标题和正文…">
      </div>
      <ul id="note-list"></ul>
      <div id="tag-bar"></div>
    </div>
    <div id="main">
      <div id="editor-pane">
        <input id="title-input" placeholder="标题">
        <input id="tags-input" placeholder="标签，逗号分隔">
        <textarea id="editor" placeholder="Markdown…"></textarea>
      </div>
      <div id="preview-pane"><div id="preview"></div></div>
    </div>
  </div>
  <div id="export-bar">
    <button data-fmt="html">HTML</button>
    <button data-fmt="md">Markdown</button>
    <button data-fmt="doc">Word</button>
    <button data-fmt="pdf">PDF</button>
    <button data-fmt="png">PNG</button>
  </div>
  <div id="statusbar"><span id="save-status">就绪</span></div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/dom-to-image-more.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
